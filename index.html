<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="CineFind movie search application"
  />

  <title>CineFind | Movie Search</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./styles.css"
  />
</head>

<body>

  <!-- React app loads here -->
  <div id="root"></div>


  <!-- React -->
  <script
    src="https://unpkg.com/react@18/umd/react.development.js">
  </script>

  <!-- React DOM -->
  <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
  </script>

  <!-- Babel allows JSX -->
  <script
    src="https://unpkg.com/@babel/standalone/babel.min.js">
  </script>


  <!-- API / JavaScript -->
  <script src="./script.js"></script>


  <!-- React Application -->
  <script
    type="text/babel"
    src="./app.jsx">
  </script>

</body>

</html>
